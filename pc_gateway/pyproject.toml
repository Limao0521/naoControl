[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nao-nemotron-gateway"
version = "0.1.0"
description = "PC-hosted multimodal Nemotron gateway for NAO Control"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "mcp>=1.12,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
]

[project.scripts]
nao-nemotron-gateway = "nao_gateway.main:main"
nao-nemotron-launcher = "nao_gateway.launcher_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
